<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#1d3a5f" />
    <meta
      name="description"
      content="Pronóstico del tiempo con horas doradas y azules para fotografía: temperatura, lluvia por hora, 7 días y la nubosidad en cada ventana de luz."
    />
    <title>RIQE Weather</title>
    <script>
      (function () {
        var lang = "es";
        try {
          var stored = localStorage.getItem("riqe-weather-locale");
          lang = stored === "es" || stored === "en" ? stored : navigator.language.toLowerCase().indexOf("es") === 0 ? "es" : "en";
        } catch (e) {}
        document.documentElement.lang = lang;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
